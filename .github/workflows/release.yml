name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump (current retries a prepared release)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lofcz/docxjs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm with OIDC support
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Prepare package version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "$RELEASE_TYPE" in
            patch|minor|major) npm version "$RELEASE_TYPE" --no-git-tag-version ;;
            current) ;;
            *) echo "Unsupported release type" >&2; exit 1 ;;
          esac
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Typecheck, build and run browser tests
        run: npm run verify-release

      - name: Check package contents
        run: npm pack --dry-run

      - name: Commit and tag tested release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
          fi
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)" || {
              echo "Tag v$VERSION already belongs to another commit" >&2
              exit 1
            }
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
          fi
          git push --atomic origin HEAD:master "refs/tags/v$VERSION"

      - name: Publish to npm using OIDC
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
          fi
